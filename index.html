<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Crop Recommendation | Smart Agriculture</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<!-- ================= NAVBAR ================= -->

<nav class="navbar">

    <div class="logo">
        🌾 Smart Agriculture
    </div>

    <ul>

        <li>
            <a href="/">Home</a>
        </li>

        <li>
            <a href="/about">About</a>
        </li>

        <li>
            <a href="/recommendation">Recommendation</a>
        </li>

        <li>
            <a href="/dashboard">Dashboard</a>
        </li>

    </ul>

</nav>


<!-- ================= RECOMMENDATION PAGE ================= -->

<section class="recommend">

    <div class="form-container">

        <div class="form-header">

            <div class="form-icon">
                🌱
            </div>

            <h1>
                Crop Recommendation
            </h1>

            <p>
                Enter soil and environmental parameters
                to predict the most suitable crop.
            </p>

        </div>


        <!-- ================= FORM ================= -->

        <form action="/predict" method="POST">

            <div class="form-grid">


                <!-- STATE -->

                <div class="input-box">

                    <label>
                        <i class="fa-solid fa-location-dot"></i>
                        State
                    </label>

                    <select name="state" required>

                        <option value="">
                            Select State
                        </option>

                        {% for state in states %}

                        <option value="{{ state }}">
                            {{ state }}
                        </option>

                        {% endfor %}

                    </select>

                </div>


                <!-- SEASON -->

                <div class="input-box">

                    <label>
                        <i class="fa-solid fa-calendar-days"></i>
                        Season
                    </label>

                    <select name="season" required>

                        <option value="">
                            Select Season
                        </option>

                        {% for season in seasons %}

                        <option value="{{ season }}">
                            {{ season }}
                        </option>

                        {% endfor %}

                    </select>

                </div>


                <!-- SOIL -->

                <div class="input-box">

                    <label>
                        <i class="fa-solid fa-earth-americas"></i>
                        Soil Type
                    </label>

                    <select name="soil" required>

                        <option value="">
                            Select Soil Type
                        </option>

                        {% for soil in soils %}

                        <option value="{{ soil }}">
                            {{ soil }}
                        </option>

                        {% endfor %}

                    </select>

                </div>


                <!-- NITROGEN -->

                <div class="input-box">

                    <label>
                        Nitrogen (N)
                    </label>

                    <input
                        type="number"
                        name="N"
                        placeholder="Enter nitrogen value"
                        required>

                </div>


                <!-- PHOSPHORUS -->

                <div class="input-box">

                    <label>
                        Phosphorus (P)
                    </label>

                    <input
                        type="number"
                        name="P"
                        placeholder="Enter phosphorus value"
                        required>

                </div>


                <!-- POTASSIUM -->

                <div class="input-box">

                    <label>
                        Potassium (K)
                    </label>

                    <input
                        type="number"
                        name="K"
                        placeholder="Enter potassium value"
                        required>

                </div>


                <!-- TEMPERATURE -->

                <div class="input-box">

                    <label>
                        <i class="fa-solid fa-temperature-half"></i>
                        Temperature (°C)
                    </label>

                    <input
                        type="number"
                        step="0.1"
                        name="temperature"
                        placeholder="Enter temperature"
                        required>

                </div>


                <!-- HUMIDITY -->

                <div class="input-box">

                    <label>
                        <i class="fa-solid fa-droplet"></i>
                        Humidity (%)
                    </label>

                    <input
                        type="number"
                        step="0.1"
                        name="humidity"
                        placeholder="Enter humidity"
                        required>

                </div>


                <!-- PH -->

                <div class="input-box">

                    <label>
                        Soil pH
                    </label>

                    <input
                        type="number"
                        step="0.1"
                        name="ph"
                        placeholder="Enter soil pH"
                        required>

                </div>


                <!-- RAINFALL -->

                <div class="input-box">

                    <label>
                        <i class="fa-solid fa-cloud-rain"></i>
                        Rainfall (mm)
                    </label>

                    <input
                        type="number"
                        step="0.1"
                        name="rainfall"
                        placeholder="Enter rainfall"
                        required>

                </div>

            </div>


            <!-- ================= PREDICT BUTTON ================= -->

            <div class="predict-container">

                <button
                    class="predict-btn"
                    type="submit">

                    🌱 Predict Suitable Crop

                </button>

            </div>

        </form>

    </div>

</section>


</body>

</html>
